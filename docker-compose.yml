services:
  api:
    build: .
    container_name: zoom_transcriber
    ports:
      - "8000:8000"    # Local development
      # - "80:8000"    # EC2 / production: uncomment this and comment line above
    volumes:
      # ── Persistent data (tasks DB + downloads) ─────────────────────────────
      # This volume survives container restarts — tasks are never lost again.
      - ./data:/app/data

      # ── Whisper model cache ─────────────────────────────────────────────────
      # The large-v3 model (~3 GB) is downloaded once and reused across rebuilds.
      # Target must match WHISPER_CACHE_DIR in the Dockerfile — the app runs as
      # appuser, so /root/... is never read (that was a silent cache miss).
      - whisper_model_cache:/app/models

      # ── Frontend hot reload (local dev) ─────────────────────────────────────
      # Read-only bind mount over the baked-in copy: edits to static/ show up
      # on browser refresh with no rebuild. Python code stays baked-in.
      - ./static:/app/static:ro

    env_file:
      # Optional: settings fall back to safe defaults, and pydantic-settings
      # reads .env itself when present — a fresh clone must still compose up.
      - path: .env
        required: false

    environment:
      - PYTHONUNBUFFERED=1
      # Structured logs in the container: one JSON object per line, ready for
      # docker logs / Loki / CloudWatch. Local `uvicorn` runs keep text format.
      - LOG_FORMAT=json
      # Override these per-environment as needed:
      # - WHISPER_MODEL=medium
      # - AUTO_SHUTDOWN_IDLE_MINUTES=30

    # ── Resources ───────────────────────────────────────────────────────────────
    # Local workstation profile (128 GB RAM, RTX 4070 Ti). The devices block
    # passes the NVIDIA GPU through (Docker Desktop WSL2 — needs only the
    # Windows NVIDIA driver). faster-whisper then runs CUDA/float16 via
    # WHISPER_DEVICE=auto. If `docker compose up` fails with "could not select
    # device driver nvidia", remove the devices block — the app falls back to
    # CPU automatically.
    deploy:
      resources:
        limits:
          memory: 24g
          cpus: '8'
        reservations:
          memory: 2g
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # Give time for first-run model download

    # The app never needs to escalate privileges (it already runs as appuser);
    # this blocks setuid/setgid escalation even if a dependency is compromised.
    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  whisper_model_cache:
    name: zoom_whisper_model_cache
    # To clear the model cache and re-download: docker volume rm zoom_whisper_model_cache
