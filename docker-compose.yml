services:
  api:
    build: .
    container_name: zoom_transcriber
    ports:
      - "8000:8000"    # Local development
      # - "80:8000"    # EC2 / production: uncomment this and comment line above
    volumes:
      # ── Persistent data (tasks DB + downloads) ─────────────────────────────
      # This volume survives container restarts — tasks are never lost again.
      - ./data:/app/data

      # ── Whisper model cache ─────────────────────────────────────────────────
      # The large-v3 model (~3 GB) is downloaded once and reused across rebuilds.
      # Target must match WHISPER_CACHE_DIR in the Dockerfile — the app runs as
      # appuser, so /root/... is never read (that was a silent cache miss).
      - whisper_model_cache:/app/models

      # ── Frontend hot reload (local dev) ─────────────────────────────────────
      # Read-only bind mount over the baked-in copy: edits to static/ show up
      # on browser refresh with no rebuild. Python code stays baked-in.
      - ./static:/app/static:ro

    env_file:
      # Optional: settings fall back to safe defaults, and pydantic-settings
      # reads .env itself when present — a fresh clone must still compose up.
      - path: .env
        required: false

    depends_on:
      # Ordering only (not a health gate): the api can start before the model is
      # pulled — the Setup Wizard drives the pull on first boot. Compose's
      # default network lets the api reach the ollama service by name.
      - ollama

    environment:
      - PYTHONUNBUFFERED=1
      # Structured logs in the container: one JSON object per line, ready for
      # docker logs / Loki / CloudWatch. Local `uvicorn` runs keep text format.
      - LOG_FORMAT=json
      # Local Ollama container for the on-demand Smart Summary feature. Reached
      # over compose's internal DNS — no host port needed.
      - OLLAMA_HOST=http://ollama:11434
      # Override these per-environment as needed:
      - WHISPER_MODEL=large-v3
      # - AUTO_SHUTDOWN_IDLE_MINUTES=30
      # - SUMMARY_BACKEND=ollama       # ollama | gemini (wizard persists this)
      - OLLAMA_MODEL=qwen2.5:32b

    # ── Resources ───────────────────────────────────────────────────────────────
    # Hardware profile (128 GB RAM, dual Xeon CPUs, RTX 6000 Ada 47GB VRAM). No CPU limit — container can use all Xeon cores. The devices block
    # passes the NVIDIA GPU through (Docker Desktop WSL2 — needs only the
    # Windows NVIDIA driver). faster-whisper then runs CUDA/float16 via
    # WHISPER_DEVICE=auto. If `docker compose up` fails with "could not select
    # device driver nvidia", remove the devices block — the app falls back to
    # CPU automatically.
    deploy:
      resources:
        limits:
          memory: 64g
        reservations:
          memory: 2g
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # Give time for first-run model download

    # The app never needs to escalate privileges (it already runs as appuser);
    # this blocks setuid/setgid escalation even if a dependency is compromised.
    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── Local LLM server (Smart Summary Map-Reduce backend) ─────────────────────
  # Pulled models persist in the ollama_models volume so a container recreate
  # never re-downloads gemma2:9b. GPU is shared with the api service (both
  # reserve the NVIDIA device); on a CPU-only host remove the deploy block and
  # the Setup Wizard will recommend the Gemini cloud fallback instead.
  ollama:
    image: ollama/ollama:latest
    container_name: zoom_ollama
    environment:
      # Bind to all interfaces — the default 127.0.0.1 bind would be
      # unreachable from the api container over the compose network.
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment to reach Ollama directly from the host (debugging / `ollama` CLI):
    # ports:
    #   - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whisper_model_cache:
    name: zoom_whisper_model_cache
    # To clear the model cache and re-download: docker volume rm zoom_whisper_model_cache
  ollama_models:
    name: zoom_ollama_models
    # To clear pulled LLMs and re-download: docker volume rm zoom_ollama_models
