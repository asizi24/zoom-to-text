services:
  api:
    build: .
    container_name: zoom_transcriber
    ports:
      - "8000:8000"    # Local development
      # - "80:8000"    # EC2 / production: uncomment this and comment line above
    volumes:
      # ── Persistent data (tasks DB + downloads) ─────────────────────────────
      # This volume survives container restarts — tasks are never lost again.
      - ./data:/app/data

      # ── Whisper model cache ─────────────────────────────────────────────────
      # The large-v3 model (~3 GB) is downloaded once and reused across rebuilds.
      # Without this, every `docker-compose up --build` re-downloads the model.
      # The app runs as appuser (uid 1000), so its HOME is /home/appuser — the
      # cache must mount there, NOT /root, or the model re-downloads every run.
      - whisper_model_cache:/home/appuser/.cache/faster_whisper

    env_file:
      - .env

    environment:
      - PYTHONUNBUFFERED=1
      # This container has no GPU passthrough (no `--gpus`, and the light image
      # ships no CUDA libs), so faster-whisper crashes if it tries cuda/float16.
      # Force CPU here — this OVERRIDES the .env (which keeps cuda/float16 for the
      # GPU home-server). int8 is the correct CPU compute type.
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      # ── Fully-local LLM (no external API) ─────────────────────────────────
      # Route summary / exam / flashcards / chat through Ollama on the HOST,
      # which uses the RTX 4070 Ti. Inside the container `localhost` is the
      # container itself, so the host's Ollama must be reached via
      # host.docker.internal (verified reachable). This OVERRIDES the .env,
      # where LLM_PROVIDER defaults to gemini and OLLAMA_BASE_URL=localhost.
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # mistral-nemo:12b chosen over .env's qwen2.5:14b after Hebrew testing:
      # qwen2.5 code-switches into Chinese mid-sentence on Hebrew reasoning
      # prompts (unusable here); mistral-nemo stays clean Hebrew, fits 100% on
      # the 4070 Ti, and has a 128k context so a full-length lecture transcript
      # is never silently truncated (gemma2:9b is cleaner Hebrew but only 8k).
      - OLLAMA_MODEL=mistral-nemo:12b
      # Context window sized to fit a 12GB GPU (KV cache + model) while leaving
      # room for the generated JSON. Long transcripts are chunked in summarizer.py,
      # so this need not hold the whole lecture at once.
      - OLLAMA_NUM_CTX=24576
      # Force Hebrew output — local models drift to English on technical content
      # (AWS/S3/IAM etc.) unless the language is pinned. "auto" is fine for Gemini.
      - LECTURE_LANGUAGE=he
      # Loopback-only one-click login — no Resend email key needed locally.
      # Honored only because BASE_URL is http://localhost (see auth.dev_login).
      - ENABLE_DEV_LOGIN=true
      # Override these per-environment as needed:
      # - WHISPER_MODEL=medium
      # - AUTO_SHUTDOWN_IDLE_MINUTES=30

    # ── Resource limits ─────────────────────────────────────────────────────────
    # Prevents the container from consuming all RAM on a shared EC2 instance.
    # Whisper large-v3 on CPU needs ~4 GB; medium needs ~2 GB.
    # Adjust based on your instance type (m7i-flex.large = 8 GB RAM).
    deploy:
      resources:
        limits:
          # Host is an i7-13700K (24 threads) / 128 GB RAM. The old 3.5-core /
          # 6 GB cap throttled CPU Whisper to a fraction of the machine. The LLM
          # now runs on the host GPU via Ollama, so the container only needs CPU
          # for transcription — give it plenty.
          memory: 12g
          cpus: '12'
        reservations:
          memory: 512m

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # Give time for first-run model download

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  whisper_model_cache:
    name: zoom_whisper_model_cache
    # To clear the model cache and re-download: docker volume rm zoom_whisper_model_cache
